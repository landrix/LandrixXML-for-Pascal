name: CI

on:
  push:
  pull_request:

jobs:
  fpc-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache the downloaded test suites
        id: suites
        uses: actions/cache@v6
        with:
          path: |
            tests/data/xmlconf-suite
            tests/data/qt3-suite
            tests/data/kosit-suite
          key: suites-${{ hashFiles('tools/run-xmlconf.py', 'tools/run-qt3.py', 'tools/run-kosit-suite.py') }}

      # a failed restore may leave a partial suite that the scripts would reuse
      - name: Remove a partially restored cache
        if: steps.suites.outputs.cache-hit != 'true'
        run: rm -rf tests/data/xmlconf-suite tests/data/qt3-suite tests/data/kosit-suite

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl
          fpc -iV

      - name: Check forbidden language features
        run: python3 tools/check-forbidden.py

      - name: Build tests
        run: |
          mkdir -p build/ci
          fpc -B -vewnhi -Fusource -Fisource -FUbuild/ci -FEbuild/ci tests/LandrixXmlTests.dpr | tee build/ci/build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Fail on warnings, hints and notes in own code
        run: |
          if grep -E '\.(pas|inc|dpr|lpr)\([0-9]+(,[0-9]+)?\) (Warning|Hint|Note)' build/ci/build.log; then
            exit 1
          fi

      - name: Run tests
        run: ./build/ci/LandrixXmlTests "$PWD"

      - name: Build and run tests with overflow and range checking
        run: |
          mkdir -p build/ci-checked
          fpc -B -vewnhi -Co -Cr -Fusource -Fisource -FUbuild/ci-checked -FEbuild/ci-checked tests/LandrixXmlTests.dpr | tee build/ci-checked/build.log
          test ${PIPESTATUS[0]} -eq 0
          if grep -E '\.(pas|inc|dpr|lpr)\([0-9]+(,[0-9]+)?\) (Warning|Hint|Note)' build/ci-checked/build.log; then
            exit 1
          fi
          ./build/ci-checked/LandrixXmlTests "$PWD"

      - name: Build and run the README examples
        run: |
          mkdir -p build/examples
          fpc -B -vewnhi -Fusource -Fisource -FUbuild/examples -FEbuild/examples examples/LandrixXmlExamples.dpr | tee build/examples/build.log
          test ${PIPESTATUS[0]} -eq 0
          if grep -E '\.(pas|inc|dpr|lpr)\([0-9]+(,[0-9]+)?\) (Warning|Hint|Note)' build/examples/build.log; then
            exit 1
          fi
          ./build/examples/LandrixXmlExamples

      - name: W3C XML conformance suite
        run: |
          mkdir -p build/fpc322-linux
          fpc -B -Fusource -Fisource -FUbuild/fpc322-linux -FEbuild/fpc322-linux tests/LandrixXmlConformance.dpr
          python3 tools/run-xmlconf.py --exe build/fpc322-linux/LandrixXmlConformance

      - name: W3C XPath test suite QT3 (XPath 2.0 cases, against the baseline)
        run: |
          mkdir -p build/fpc322-linux
          fpc -B -Fusource -Fisource -FUbuild/fpc322-linux -FEbuild/fpc322-linux tests/LandrixXmlQt3.dpr
          python3 tools/run-qt3.py --exe build/fpc322-linux/LandrixXmlQt3
          python3 tools/run-qt3.py --exe build/fpc322-linux/LandrixXmlQt3 --profile saxon

      - name: KoSIT XRechnung test suite (XML schema and Schematron, against KoSIT and Saxon)
        run: |
          mkdir -p build/fpc322-linux
          fpc -B -Fusource -Fisource -FUbuild/fpc322-linux -FEbuild/fpc322-linux tests/LandrixXmlKosit.dpr
          python3 tools/run-kosit-suite.py --exe build/fpc322-linux/LandrixXmlKosit
